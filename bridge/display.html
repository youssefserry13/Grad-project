<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121922; --text: #eef3f8; --muted: #93a1b3;
    --you: #1f2a37; --nova: #0f3b3a; --nova-edge: #2dd4bf;
    --ready: #34d399; --listening: #f87171; --thinking: #fbbf24; --offline: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 20px 40px; border-bottom: 1px solid #1e2834; }
  .brand { display: flex; align-items: baseline; gap: 18px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 48px; letter-spacing: 1px; }
  .brand span { color: var(--muted); font-size: 22px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .status { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 600;
    white-space: nowrap; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--ready); }
  .status.listening .dot { background: var(--listening); animation: pulse 1s infinite; }
  .status.thinking .dot { background: var(--thinking); animation: pulse 0.6s infinite; }
  .status.offline .dot { background: var(--offline); }
  .status .src { color: var(--muted); font-weight: 400; font-size: 26px; }
  @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.8); } }

  main { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    padding: 24px 40px 32px; gap: 20px; }
  main::before { content: ""; margin-top: auto; }   /* newest at the bottom; overflow is measurable */
  .empty { color: var(--muted); font-size: 34px; text-align: center; margin: auto; }
  .turn { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; }
  .row.you { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 16px 24px; border-radius: 22px; font-size: 34px;
    line-height: 1.3; overflow-wrap: anywhere; }
  .you .bubble { background: var(--you); color: #d7e0ea; border-bottom-right-radius: 6px; }
  .nova .bubble > div { min-width: 0; }
  .nova .bubble { background: var(--nova); border: 2px solid var(--nova-edge);
    border-bottom-left-radius: 6px; display: flex; gap: 22px; align-items: flex-start; }
  .who { display: block; font-size: 20px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .nova .who { color: var(--nova-edge); }
  .thumb { width: 220px; max-height: 220px; object-fit: cover; border-radius: 12px;
    flex: none; border: 1px solid #2b3a4a; }
  .badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .badge { font-size: 20px; padding: 4px 14px; border-radius: 999px; background: #0b1620;
    color: #b8c6d6; border: 1px solid #2b3a4a; }
  .badge.manual { color: #99f6e4; border-color: #14b8a6; }
  .badge.camera { color: #c4b5fd; border-color: #8b5cf6; }
  .badge.chat { color: #fcd34d; border-color: #b45309; }
  .turn.hidden { display: none; }
  .older { opacity: 0.55; }
  .older .bubble { font-size: 26px; }
  .older .thumb { width: 140px; max-height: 140px; }
  @media (max-width: 700px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .brand span { display: none; }
    .bubble { max-width: 95%; font-size: 24px; }
    .older .bubble { font-size: 20px; }
    .status { font-size: 24px; }
    .thumb { width: 120px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Nova</h1><span>Offline assistant · SV-CH / SV-F milling machine</span></div>
  <div id="status" class="status offline"><div class="dot"></div><span id="status-text">Connecting…</span><span id="status-src" class="src"></span></div>
</header>
<main id="chat"><div class="empty">Ask Nova a question…</div></main>
<script>
"use strict";
const TURNS = 6;
const chat = document.getElementById("chat");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("status-text");
const statusSrc = document.getElementById("status-src");
let lastKey = "";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // textContent: never interpreted as HTML
  return e;
}

function sourceBadge(t) {
  const pages = (t.pages || []).join(", ");
  if (t.route === "image") {
    const extra = pages ? " · Manual p." + pages : (t.general ? " · general" : "");
    return ["camera", "Camera" + extra];
  }
  if (t.route === "rag") return ["manual", t.not_found ? "Manual · not found" : "Manual p." + pages];
  return ["chat", "Chat"];
}

function renderTurns(history) {
  chat.replaceChildren();
  const turns = history.slice(-TURNS);
  if (!turns.length) { chat.append(el("div", "empty", "Ask Nova a question…")); return; }
  turns.forEach((t, i) => {
    const turn = el("div", "turn" + (i < turns.length - 2 ? " older" : ""));
    const you = el("div", "row you");
    const yb = el("div", "bubble");
    yb.append(el("span", "who", "You"), document.createTextNode(t.transcript || ""));
    you.append(yb);
    const nova = el("div", "row nova");
    const nb = el("div", "bubble");
    if (t.thumb) {
      const img = el("img", "thumb");
      img.src = "/display/frame/" + t.id + ".jpg";
      img.alt = "camera frame";
      nb.append(img);
    }
    const body = el("div");
    body.append(el("span", "who", "Nova"), document.createTextNode(t.answer || ""));
    const badges = el("div", "badges");
    const [cls, label] = sourceBadge(t);
    badges.append(el("span", "badge " + cls, label));
    badges.append(el("span", "badge", t.origin === "esp" ? "ESP" : "Laptop"));
    if (t.total_s != null) badges.append(el("span", "badge", Number(t.total_s).toFixed(1) + " s"));
    body.append(badges);
    nb.append(body);
    nova.append(nb);
    turn.append(you, nova);
    chat.append(turn);
  });
  fit();
}

// Drop the oldest turns that don't fit on screen (never clip a bubble in half).
function fit() {
  chat.querySelectorAll(".turn.hidden").forEach(t => t.classList.remove("hidden"));
  const turns = [...chat.querySelectorAll(".turn")];
  for (let i = 0; i < turns.length - 1 && chat.scrollHeight > chat.clientHeight; i++) {
    turns[i].classList.add("hidden");
  }
}
window.addEventListener("resize", fit);

function renderStatus(st) {
  const state = st ? st.state : "offline";
  statusEl.className = "status " + state;
  statusText.textContent = {listening: "Listening…", thinking: "Thinking…", ready: "Ready",
                            offline: "Bridge offline"}[state] || state;
  statusSrc.textContent = st && st.input && state !== "ready" ? "(" + st.input + ")" : "";
}

async function poll() {
  try {
    const r = await fetch("/last_answer", {cache: "no-store"});
    const d = await r.json();
    renderStatus(d.status);
    const key = (d.history || []).map(h => h.id).join(",");
    if (key !== lastKey) { lastKey = key; renderTurns(d.history || []); }
  } catch (e) {
    renderStatus(null);
  }
  setTimeout(poll, 500);
}
poll();
</script>
</body>
</html>
